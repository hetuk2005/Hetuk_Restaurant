<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hetuk Restaurant</title>
        <link rel="stylesheet" href="./CSS/index.css">
        <link
            href="https://maxcdn.bootstrapcdn.com/font-awesome/4.2.0/css/font-awesome.min.css"
            rel="stylesheet">
    </head>
    <body>
        <!-- Navbar -->

        <nav></nav>

        <!-- Slides -->
        <div class="hero_slider">
            <!-- Slide-1 -->

            <div class="slider active">
                <img src="./Utilies/hero_slider_1.jpg" alt="Image 1"
                    class="hero_img">
                <div class="slider_content">
                    <h1>For The Love Of Delicious Food</h1>
                    <p>Come with family & feel the joy of mouthwatering food</p>
                    <br>
                    <button>View On Menu</button>
                </div>
            </div>

            <!-- Slide-2 -->
            <div class="slider">
                <img src="./Utilies/hero_slider_2.jpg" alt="Image 2"
                    class="hero_img1">
                <div class="slider_content">
                    <h1>Flavors Inspired by the Seasons</h1>
                    <p>Come with family & feel the joy of mouthwatering food</p>
                    <br>
                    <button>View On Menu</button>
                </div>
            </div>

            <!-- Slide-3 -->
            <div class="slider">
                <img src="./Utilies/hero_slider_3.jpg" alt="Image 3"
                    class="hero_img2">
                <div class="slider_content">
                    <h1>Where every flavor tells a story</h1>
                    <p>Come with family & feel the joy of mouthwatering food</p>
                    <br>
                    <button>View On Menu</button>
                </div>
            </div>

            <!-- Navigation Arrows -->
            <button class="arrow prev"><p>❮</p></button>
            <button class="arrow next"><p>❯</p></button>
        </div>
    </body>
    <script src="./JS/index.js"></script>
    <script type="module">
        import {navBar,navStyle} from "./JS/Components.js";

        document.querySelector("nav").innerHTML=navBar();

        let styleTag=document.createElement("style");
        styleTag.textContent=navStyle();
        document.head.append(styleTag);
    </script>
</html>
