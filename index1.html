<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            body{
                background-color: #1a1a1a;
            }
            .parent{
                width: 50%;
                margin: auto;
                color: #fff;
                background: #000 url(./Utlies/form-pattern.png);
                position: relative;
                background-position: center top;
                text-align: center;
                padding: 15px;
            }
            .has-before, .has-after {
    position: relative;
    z-index: 1;
}
.has-before::before, .has-after::after {
    content: "";
    position: absolute;
}
            .parent::after,.parent::before{
                top: 0;
                position: absolute;
                width: 21px;
                height: 100%;
                background-image: url(./Utilies/footer-form-pattern.svg);
                background-repeat: no-repeat;
                background-size: cover;
            }
            .parent::after{
                right: 0;
            }
            .parent::before{
                left: 0;
            }
        </style>
    </head>
    <body>
        <div class="parent has-before has-after">
            <h1>Hello</h1>
            <h2>Hello</h2>
            <h3>Hello</h3>
            <h4>Hello</h4>
            <h5>Hello</h5>
            <h6>Hello</h6>
        </div>
    </body>
</html>
