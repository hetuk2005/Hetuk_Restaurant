<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Circle Illusion</title>
        <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #111;
    }

    .circle {
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background:
        repeating-conic-gradient(
          white 0deg 10deg,
          black 10deg 20deg
        );
      animation: rotate 8s linear infinite;
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }
  </style>
    </head>
    <body>

        <div class="circle"></div>

    </body>
</html>
