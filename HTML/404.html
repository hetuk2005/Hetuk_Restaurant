<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Error 404 Page</title>
        <link rel="stylesheet" href="../CSS/Error_Page.css">
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
        <link rel="shortcut icon" href="../Utilies/favicon.svg"
            type="image/x-icon">
        <link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    </head>
    <body>
        <div class="body">

            <!-- Loader -->
            <div id="loader">
                <div class="spinner"></div>
                <p class="loader_title">Hetuk</p>
            </div>

            <!-- Scroll_arrow -->
            <a href="#" class="to-top">
                <i class="fas fa-chevron-up"></i>
            </a>

            <!-- Navbar -->
            <nav></nav>

            <!-- Error Page -->
            <div class="text">
                <h2>404</h2>
                <h5>This page is not on our menu</h5>
                <button><a href="../HTML/Menu.html">Back To Menu</a></button>
            </div>
        </div>

        <!-- Footer -->
        <footer></footer>

    </body>
    <script type="module">
        
        import {navBar,footerBar,navStyle,footerStyle,setActive} from "../JS/Components.js";

        document.querySelector("nav").innerHTML=navBar();
        document.querySelector("footer").innerHTML=footerBar();

        let styleTag=document.createElement("style");
        styleTag.textContent=navStyle() + footerStyle();
        document.head.append(styleTag);

        setActive();

    //Scroll-Arrow-code
const toTop = document.querySelector(".to-top");

    window.addEventListener("scroll", () => {
        if (window.pageYOffset > 100) {
            toTop.classList.add("active");
        } else {
            toTop.classList.remove("active");
        }
    });
    </script>
</html>
